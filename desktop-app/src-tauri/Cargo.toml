[package]
name = "a-coder-desktop"
version = "0.80.140"
description = "Desktop wrapper for a-coder-cli"
authors = ["The A-Tech Corporation PTY LTD"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
walkdir = "2"
which = "7"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "multipart"] }
flate2 = "1"
url = "2"
dirs = "6"
# The gateway's streaming HTML rewriter (reading-frame fallback mode).
lol_html = "1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# File diagnostics: browser panels launched via `open` have no stderr to read.

# Browser panel: pages route their network through our loopback proxy and
# capture through their own engine, which reaches into wry's platform
# webviews. Versions align with wry (see its Cargo.toml) so the crates
# unify; anything linking macOS 14+ Network calls stays behind dlopen.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphics",
	"NSResponder", "NSView", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSScreen",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std", "objc2-core-foundation", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry",
	"NSKeyValueCoding", "NSObject", "NSString", "NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
	"std", "objc2-core-foundation", "objc2-app-kit", "block2", "WKWebView", "WKWebViewConfiguration",
	"WKWebsiteDataStore", "WKSnapshotConfiguration", "WKContentRuleList", "WKContentRuleListStore",
	"WKUserContentController",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
glib = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = false
lto = true
opt-level = 3
debug = "line-tables-only"

