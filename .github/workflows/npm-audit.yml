name: npm audit

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      # The desktop and floor-plan UI are separate npm projects with their own
      # lockfiles, so the root audit does not see them.
      - name: Audit desktop-app production vulnerabilities
        working-directory: desktop-app
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit virtual-office-ui production vulnerabilities
        working-directory: virtual-office-ui
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify registry signatures
        run: npm audit signatures --omit=dev
