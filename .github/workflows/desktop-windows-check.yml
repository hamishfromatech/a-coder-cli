# Compile-verify the desktop app's platform-native code on real runners: the
# browser panel's WebView2 capture/mute/permission paths on Windows, the
# crate's cfg surface on Linux. There is no full cross-compile check for these
# locally: macOS lacks the MSVC toolchain the TLS/native build scripts need,
# so cfg'd code can otherwise drift unnoticed until a Windows/Linux release
# build — which is exactly how the v0.80.139 tag run failed.
#
# Triggers on the release branch too: all desktop work happens on
# feat/desktop-unified-release, so a main-only trigger would never see it.
name: desktop-windows-check

on:
  push:
    branches: [main, feat/desktop-unified-release]
    paths:
      - "desktop-app/src-tauri/**"
      - ".github/workflows/desktop-windows-check.yml"
  pull_request:
    paths:
      - "desktop-app/src-tauri/**"
      - ".github/workflows/desktop-windows-check.yml"
  workflow_dispatch: {}

concurrency:
  group: desktop-windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri
      - run: cargo check
      - run: cargo test --quiet

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libclang-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri
      - run: cargo check