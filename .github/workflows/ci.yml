name: CI

# Triggers on the release branch too: fork fixes land on
# feat/desktop-unified-release, so a main-only pull_request trigger would never
# run build/check/test on those PRs. Mirrors desktop-build.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/desktop-unified-release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        # The release branch is a long-lived fork snapshot, not a mainline that
        # tracks models.dev, so a live refresh drifts from the committed
        # catalogs and from the tests pinned to their model IDs. Test the
        # committed snapshot as build-binaries.yml does; main keeps the live
        # regeneration.
        env:
          PI_SKIP_GENERATE: ${{ github.base_ref == 'feat/desktop-unified-release' && '1' || '' }}
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
