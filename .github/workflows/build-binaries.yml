name: Build Binaries

on:
  push:
    branches:
      - feat/desktop-unified-release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # Keep the public GitHub Release publication last. Binary assets are staged in
  # a draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to v11 (avoid npm 10 edgesOut bug)
        # build-binaries.sh installs cross-platform optional native bindings
        # with `npm install --force --package-lock=false`, which hits an npm 10
        # internal bug ("Cannot read properties of null (reading 'edgesOut')").
        # npm 11 (bundled with Node 24, or upgraded here) handles it.
        run: npm install -g npm@11

      - name: Build binaries
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          ./scripts/build-binaries.sh --skip-install

      - name: Upload CLI binaries (branch test)
        # On non-tag pushes (e.g. the feat branch) there's no release to stage;
        # upload the raw binaries so the build can be downloaded and tested.
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-binaries-${{ github.run_id }}
          path: packages/coding-agent/binaries/*
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub release payload
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md || echo "A-Coder CLI ${RELEASE_TAG}" > release-assets/RELEASE_NOTES.md
          node scripts/generate-coding-agent-install-lock.mjs --check || true
          cp packages/coding-agent/install-lock/package.json release-assets/pi-coding-agent-install-package.json
          cp packages/coding-agent/install-lock/package-lock.json release-assets/pi-coding-agent-install-package-lock.json

          cd packages/coding-agent/binaries

          binary_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
          )

          for asset in "${binary_assets[@]}"; do
            test -f "${asset}"
          done

          cp "${binary_assets[@]}" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          release_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload GitHub release payload
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  # Desktop installers (macOS dmg, Linux deb/AppImage, Windows nsis/msi) are
  # built by the reusable desktop-build workflow and staged into the same
  # unified GitHub Release as the CLI binaries below. Runs in parallel with
  # the CLI build.
  desktop-build:
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    # Reusable workflows don't inherit secrets by default; forward them so
    # desktop-build gets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) for signing the
    # updater artifacts (and any Apple/Windows signing secrets).
    secrets: inherit

  stage-github-release:
    runs-on: ubuntu-latest
    needs: [build, desktop-build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail

          cd release-assets

          expected_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
            SHA256SUMS
            RELEASE_NOTES.md
          )

          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: desktop-artifacts
          merge-multiple: false

      - name: Flatten desktop installers into release-assets
        run: |
          set -euo pipefail
          # Copy every installer and updater artifact produced by the desktop
          # build matrix into release-assets/ so they ship in one release.
          find desktop-artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.AppImage.tar.gz' -o \
            -name '*.AppImage.tar.gz.sig' -o \
            -name '*-setup.exe' -o \
            -name '*-setup.nsis.zip' -o \
            -name '*-setup.nsis.zip.sig' -o \
            -name '*.msi' -o \
            -name '*.msi.sig' -o \
            -name '*.exe.sig' \
          \) -exec cp {} release-assets/ \;

          echo "Staged desktop assets:"
          ls -la release-assets/*.dmg release-assets/*.deb release-assets/*.AppImage* \
            release-assets/*-setup.* release-assets/*.msi* 2>/dev/null || true

      - name: Generate Tauri updater latest.json
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # Build the Tauri v2 updater manifest by scanning the per-target
          # desktop artifact directories (deterministic arch mapping). The
          # flatten step above copies the archives into release-assets/ under
          # their original basenames, so download URLs use those basenames.
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GH_REPO;
          const version = tag.replace(/^v/, "");
          const pubDate = new Date().toISOString();
          const base = `https://github.com/${repo}/releases/download/${tag}`;
          const root = "desktop-artifacts";

          // [updaterKey, targetDir, archiveGlob, sigGlob]
          const specs = [
            ["darwin-aarch64", "a-coder-desktop-aarch64-apple-darwin", "*.app.tar.gz", "*.app.tar.gz.sig"],
            ["darwin-x86_64",  "a-coder-desktop-x86_64-apple-darwin",  "*.app.tar.gz", "*.app.tar.gz.sig"],
            ["linux-x86_64",   "a-coder-desktop-x86_64-unknown-linux-gnu", "*.AppImage.tar.gz", "*.AppImage.tar.gz.sig"],
            ["win32-x86_64",   "a-coder-desktop-x86_64-pc-windows-msvc", "*-setup.nsis.zip", "*-setup.nsis.zip.sig"],
          ];

          function findOne(dir, glob) {
            if (!fs.existsSync(dir)) return null;
            const re = new RegExp("^" + glob.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
            const hit = fs.readdirSync(dir, { withFileTypes: true })
              .filter((e) => e.isFile() && re.test(e.name))
              .map((e) => e.name)
              .sort()[0];
            return hit ? path.join(dir, hit) : null;
          }
          function walk(dir) {
            // Recursively find the first file matching glob under dir.
            if (!fs.existsSync(dir)) return null;
            const stack = [dir];
            while (stack.length) {
              const cur = stack.pop();
              for (const e of fs.readdirSync(cur, { withFileTypes: true })) {
                const full = path.join(cur, e.name);
                if (e.isDirectory()) stack.push(full);
                else if (e.isFile() && matcher(e.name)) return full;
              }
            }
            return null;
          }
          function matcher(glob) {
            return (name) => {
              const re = new RegExp("^" + glob.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
              return re.test(name);
            };
          }

          const platforms = {};
          for (const [key, targetDir, archiveGlob, sigGlob] of specs) {
            const dir = path.join(root, targetDir);
            const match = matcher(archiveGlob);
            const sigMatch = matcher(sigGlob);
            // Search recursively; updater archives live under .../release/bundle/.
            const findRec = (d, test) => {
              if (!fs.existsSync(d)) return null;
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const full = path.join(d, e.name);
                if (e.isDirectory()) { const r = findRec(full, test); if (r) return r; }
                else if (e.isFile() && test(e.name)) return full;
              }
              return null;
            };
            const archive = findRec(dir, match);
            const sig = findRec(dir, sigMatch);
            if (!archive || !sig) { console.error(`  skipping ${key} (missing archive or signature in ${targetDir})`); continue; }
            platforms[key] = {
              signature: fs.readFileSync(sig, "utf8").trim(),
              url: `${base}/${path.basename(archive)}`,
            };
          }

          const manifest = { version, notes: `A-Coder Desktop ${version}`, pub_date: pubDate, platforms };
          fs.writeFileSync("release-assets/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("Generated latest.json:");
          console.log(fs.readFileSync("release-assets/latest.json", "utf8"));
          NODE
      - name: Create draft GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd release-assets

          # CLI assets that MUST be present (validated as a subset below).
          cli_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-windows-x64.zip
            pi-windows-arm64.zip
            pi-coding-agent-install-package.json
            pi-coding-agent-install-package-lock.json
            SHA256SUMS
          )

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Upload every staged file (CLI binaries + desktop installers +
          # updater manifest). Exclude RELEASE_NOTES.md, which is the body.
          mapfile -t upload_files < <(find . -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${upload_files[@]}"

          # Validate the CLI asset set is present (subset check). Desktop
          # installer filenames are version-dependent, so we do not require an
          # exact match against the full asset list.
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          for asset in "${cli_assets[@]}"; do
            if ! grep -qx "${asset}" <<<"${actual_asset_names}"; then
              echo "::error::Missing required CLI asset: ${asset}"
              diff -u <(printf '%s\n' "${cli_assets[@]}" | sort) <(printf '%s\n' "${actual_asset_names}") || true
              exit 1
            fi
          done

          echo "Unified draft release staged with CLI + desktop assets:"
          printf '%s\n' "${actual_asset_names}"

  publish-npm:
    runs-on: ubuntu-latest
    needs: stage-github-release
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Upgrade npm for trusted publishing
        if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        # npm publishing is opt-in via the ENABLE_NPM_PUBLISH repo variable
        # (default: off). build/check/test above still run on every release to
        # gate it; only the registry publish is skipped.
        if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
        run: node scripts/publish.mjs

  publish-github-release:
    runs-on: ubuntu-latest
    needs: stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - desktop-build
      - stage-github-release
      - publish-npm
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-npm.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
